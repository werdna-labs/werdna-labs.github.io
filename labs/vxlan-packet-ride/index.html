<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>VXLAN Packet Ride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed WebGL fabric; brand + grouped scenario tabs top-left, header-stack inspector right, hop timeline + transport bottom.
   Palette: HPE dark neutrals + HPE core palette, Aruba orange/blue, Juniper green. Single committed dark look. */
:root{
  color-scheme: dark;
  --bg:#1c1c1c; --panel:rgba(34,34,34,.93); --raise:#2b2b2b; --line:#3d3d3d;
  --ink:#f4f4f4; --mute:#a6a6a6; --faint:#727272;
  --brand:#01a982;           /* HPE green */
  --under:#ff8300;           /* Aruba orange */
  --over:#00e8cf;            /* HPE teal */
  --l3:#fec901;              /* HPE yellow */
  --ctrl:#7630ea; --ctrl-ink:#a983f4;   /* HPE purple + legible tint */
  --esi:#2e7cbe;  --esi-ink:#6ea9dd;    /* Aruba meridian blue + tint */
  --gbp:#84b135;             /* Juniper green */
  --drop:#c54e4b; --drop-ink:#e2807d;   /* HPE red + tint */
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
#app{position:relative;height:100%}
#view{position:absolute;inset:0}
#view canvas{display:block;touch-action:none}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

#top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));right:calc(420px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;gap:12px;align-items:flex-start}
.brand .mark{width:46px;height:11px;margin-top:7px;flex:none;background:var(--brand);border-radius:1px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--mute);font-size:13px;max-width:62ch}
#scen{display:flex;flex-direction:column;gap:6px}
.grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.grp>span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);width:112px;flex:none}
.grp button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:12.5px;color:var(--mute);display:inline-flex;gap:6px;align-items:center}
.grp button i{width:7px;height:7px;border-radius:50%;display:inline-block}
.grp button[aria-selected="true"]{color:#111;background:var(--ink);border-color:var(--ink);font-weight:600}
#scenSel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}

#panel{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(132px + env(safe-area-inset-bottom,0px));width:396px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent,var(--brand));border-radius:6px;padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#panel h2{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.08;margin:0;text-wrap:balance}
#panel p{margin:0;color:#d6d6d6;max-width:62ch}
.drop{background:color-mix(in srgb,var(--drop) 22%,transparent);border:1px solid var(--drop);color:var(--drop-ink);border-radius:6px;padding:7px 10px;font-weight:600;font-size:13px}
.sees{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;padding:10px 12px;border-radius:6px;background:var(--raise);margin:0}
.sees dt{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding-top:2px}
.sees dd{margin:0;color:#d6d6d6;min-width:0}
.sees .u{color:var(--under)} .sees .o{color:var(--over)}
.lookup{font-family:var(--f-mono);font-size:11.5px;border:1px dashed var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:4px}
.lookup .lk{color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
.lookup div{display:grid;grid-template-columns:minmax(0,auto) 1fr;gap:2px 10px}
.lookup b{font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.lookup span{color:#d6d6d6;overflow-wrap:anywhere}
.stackhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.stackhead .tot{color:var(--ink);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:4px}
.hdr{--c:var(--over);border-left:4px solid var(--c);background:var(--raise);border-radius:0 5px 5px 0;padding:6px 10px 7px}
.hdr .hn{display:flex;align-items:baseline;gap:8px;font-weight:600;font-size:13px}
.hdr .hn small{font-family:var(--f-mono);font-weight:400;color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.hdr .hn em{margin-left:auto;font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--c);color:#111;font-weight:500;white-space:nowrap}
.hdr dl{margin:3px 0 0;display:grid;grid-template-columns:auto 1fr;gap:0 10px;font-family:var(--f-mono);font-size:11.5px}
.hdr dt{color:var(--mute)} .hdr dd{margin:0;min-width:0;overflow-wrap:anywhere}
.hdr.gone{opacity:.38} .hdr.gone dl{text-decoration:line-through}
.hdr.c-under{--c:var(--under)} .hdr.c-l3{--c:var(--l3)} .hdr.c-ctrl{--c:var(--ctrl-ink)} .hdr.c-esi{--c:var(--esi-ink)} .hdr.c-gbp{--c:var(--gbp)} .hdr.c-drop{--c:var(--drop-ink)}
.hdr.c-vx{border-left:0;padding-left:14px;background:linear-gradient(90deg,var(--under) 0 2px,var(--over) 2px 4px,var(--raise) 4px)}
.hdr.c-vx em{background:var(--over)}
.note{font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.cmpwrap{overflow-x:auto}
.cmp{border-collapse:collapse;font-size:11.5px;width:100%;min-width:340px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:5px 6px;border-bottom:1px solid var(--line)}
.cmp thead th{font-family:var(--f-mono);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.cmp thead th:last-child{color:var(--gbp)}
.cmp tbody th{color:var(--mute);font-weight:500}
.cmp td:last-child{color:var(--ink)}
.cmp td{color:#c8c8c8}

#ctl{position:absolute;left:0;right:calc(420px + env(safe-area-inset-right,0px));bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));padding-left:calc(16px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,rgba(28,28,28,.94) 35%)}
#timeline{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
#timeline button{flex:1 0 auto;min-width:70px;background:transparent;border:0;border-top:3px solid var(--line);padding:6px 4px 0;text-align:left;cursor:pointer;color:var(--faint)}
#timeline button .n{font-family:var(--f-mono);font-size:10.5px}
#timeline button .t{display:block;font-size:12px;white-space:nowrap}
#timeline button.done{border-top-color:var(--mute);color:var(--mute)}
#timeline button.cur{border-top-color:var(--accent,var(--brand));color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--brand);color:#0b0b0b;border-color:var(--brand);font-weight:600}
.btn[aria-pressed="true"]{border-color:var(--brand);color:var(--brand)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--raise);border:0;padding:7px 11px;cursor:pointer;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#111;font-weight:600}
.spacer{flex:1}
select{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#vr{border-color:var(--brand)}
#toast{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#111;padding:9px 14px;border-radius:6px;font-size:13px;max-width:min(520px,calc(100% - 32px));z-index:5}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--faint)}

@media (max-width:1100px){.legend{display:none}}
@media (max-width:860px){
  #top{right:calc(16px + env(safe-area-inset-right,0px))}
  .brand p,.kbd,#scen{display:none}
  #scenSel{display:block}
  .brand h1{font-size:24px}
  #panel{top:auto;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));width:auto;bottom:calc(122px + env(safe-area-inset-bottom,0px));max-height:40%;padding:14px}
  #panel h2{font-size:21px}
  #ctl{right:0}
  #timeline button{min-width:58px}
}
</style>
</head>
<body>

<div id="app">
  <div id="view" aria-label="3D EVPN-VXLAN fabric"></div>
  <header id="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div>
      <h1>VXLAN Packet Ride</h1>
      <p>Two spines, four leaves, one tenant, one ESI-LAG. Ride a packet through the underlay while its overlay twin crosses the tunnel.</p>
    </div></div>
    <nav id="scen" aria-label="Scenario"></nav>
    <select id="scenSel" aria-label="Scenario"></select>
    <div class="legend">
      <span><i style="background:var(--under)"></i>Underlay</span>
      <span><i style="background:var(--over)"></i>L2 VNI</span>
      <span><i style="background:var(--l3)"></i>L3VNI</span>
      <span><i style="background:var(--ctrl)"></i>EVPN routes</span>
      <span><i style="background:var(--esi)"></i>ESI multihoming</span>
      <span><i style="background:var(--gbp)"></i>GBP tag</span>
      <span><i style="background:var(--drop)"></i>Policy drop</span>
    </div>
  </header>
  <aside id="panel" aria-live="polite"></aside>
  <footer id="ctl">
    <div id="timeline" aria-label="Hops"></div>
    <div class="row">
      <button class="btn" id="prev" title="Back one stop (←)">◀ Back</button>
      <button class="btn primary" id="next" title="Next hop (Space)">Next hop ▶</button>
      <button class="btn" id="auto" aria-pressed="false">Auto</button>
      <button class="btn" id="restart">Restart</button>
      <div class="seg" role="group" aria-label="Camera">
        <button id="vRide" aria-pressed="false">Ride</button>
        <button id="vOver" aria-pressed="true">Overview</button>
      </div>
      <button class="btn" id="tU" aria-pressed="true">Underlay</button>
      <button class="btn" id="tO" aria-pressed="true">Overlay</button>
      <label class="row" style="gap:6px"><span class="kbd" style="display:inline">Speed</span>
        <select id="speed"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.8">1.8×</option></select></label>
      <span class="spacer"></span>
      <button class="btn" id="vr">Enter VR</button>
    </div>
  </footer>
  <div id="toast" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* HPE core palette, Aruba brand, Juniper green */
const COL={under:0xff8300,over:0x00e8cf,l3:0xfec901,ctrl:0x7630ea,esi:0x2e7cbe,gbp:0x84b135,drop:0xc54e4b,brand:0x01a982};
const CSS={under:'#ff8300',over:'#00e8cf',l3:'#fec901',ctrl:'#a983f4',esi:'#6ea9dd',gbp:'#84b135',drop:'#e2807d',brand:'#01a982'};

/* ---------------- topology ---------------- */
const N={
  HA:{p:[-9,0,4.5],t:'host',n:'Host A',s:'10.1.10.11 · VLAN 10'},
  HD:{p:[0,0,6.6],t:'host',n:'Host D',s:'10.1.10.44 · ESI-LAG'},
  HC:{p:[4.6,0,4.5],t:'host',n:'Host C',s:'10.1.20.33 · VLAN 20'},
  HB:{p:[9,0,4.5],t:'host',n:'Host B',s:'10.1.10.22 · VLAN 10'},
  L1:{p:[-9,4,0],t:'leaf',n:'Leaf1',s:'VTEP 10.0.0.1'},
  L2:{p:[-3,4,0],t:'leaf',n:'Leaf2',s:'VTEP 10.0.0.2'},
  L3:{p:[3,4,0],t:'leaf',n:'Leaf3',s:'VTEP 10.0.0.3'},
  L4:{p:[9,4,0],t:'leaf',n:'Leaf4',s:'VTEP 10.0.0.4'},
  S1:{p:[-5,10,-3],t:'spine',n:'Spine1',s:'lo0 10.0.0.11 · EVPN RR'},
  S2:{p:[5,10,-3],t:'spine',n:'Spine2',s:'lo0 10.0.0.12 · EVPN RR'},
  V1:{p:[-9,17,0],t:'vtep',n:'VTEP 1',s:'10.0.0.1'},
  V2:{p:[-3,17,0],t:'vtep',n:'VTEP 2',s:'10.0.0.2'},
  V3:{p:[3,17,0],t:'vtep',n:'VTEP 3',s:'10.0.0.3'},
  V4:{p:[9,17,0],t:'vtep',n:'VTEP 4',s:'10.0.0.4'}
};
const V3=a=>new THREE.Vector3(a[0],a[1],a[2]);
function attach(id){const n=N[id];const v=V3(n.p);if(n.t==='host')v.y+=2.1;return v;}

/* ---------------- header builders ---------------- */
const M={A:'52:54:00:0a:00:11',B:'52:54:00:0a:00:22',C:'52:54:00:14:00:33',D:'52:54:00:0a:00:44',GW:'00:00:5e:00:01:01',
  L1:'2c:6b:f5:01:00:01',L3:'2c:6b:f5:03:00:01',S1:'2c:6b:f5:a1:00:01',S2:'2c:6b:f5:a2:00:01',BC:'ff:ff:ff:ff:ff:ff'};
const ESI='00:11:22:33:44:55:66:77:88:99';
const eth=(s,d,st,nm,type,c)=>({k:'ieth',nm:nm||'Ethernet',b:14,st,c,f:[['src',s],['dst',d],['type',type||'0x0800 IPv4']]});
const ip=(s,d,ttl,st,nm,c)=>({k:'iip',nm:nm||'IPv4',b:20,st,c,f:[['src',s],['dst',d],['ttl',ttl]]});
const icmp=()=>({k:'pay',nm:'ICMP echo request',b:64,f:[['type','8 · seq 1'],['data','56 B']]});
const arp=(nm,a,b)=>({k:'pay',nm,b:28,f:[a,b]});
const oeth=(s,d,st)=>({k:'oeth',nm:'Outer Ethernet',b:14,st,c:'under',f:[['src',s],['dst',d]]});
const oip=(s,d,ttl,st)=>({k:'oip',nm:'Outer IPv4',b:20,st,c:'under',f:[['src',s],['dst',d],['proto','17 UDP'],['ttl',ttl]]});
const udp=(sp,st)=>({k:'udp',nm:'Outer UDP',b:8,st,c:'under',f:[['src port',sp+' · inner-flow hash'],['dst port','4789 VXLAN']]});
const vx=(vni,st,c)=>({k:'vx',nm:'VXLAN',b:8,st,c:c||'vx',f:[['flags','I bit set'],['VNI',vni]]});
const vxg=(vni,gpid,st)=>({k:'vx',nm:'VXLAN-GBP',b:8,st,c:'gbp',f:[['flags','G=1 · I=1 · A=0 (policy not yet applied)'],['group policy ID',gpid],['VNI',vni]]});
const tip=(s,d,st)=>({k:'oip',nm:'IPv4 (underlay)',b:20,st,c:'under',f:[['src',s],['dst',d],['proto','6 TCP']]});
const tcp=()=>({k:'udp',nm:'TCP',b:20,c:'under',f:[['dst port','179 BGP']]});
const bgp=(nm,f,st,c)=>({k:'bgp',nm,b:0,st,c:c||'ctrl',f});
const gone=h=>Object.assign({},h,{st:'gone'});
const same=h=>Object.assign({},h,{st:''});
const pay=h=>h;

/* ---------------- scenarios ---------------- */
const SC=[];

/* Bridged */
(function(){
  const e0=eth(M.A,M.B,'new'),i0=ip('10.1.10.11','10.1.10.22',64,'new'),p=icmp();
  const ie=eth(M.A,M.B,'','Inner Ethernet'),ii=ip('10.1.10.11','10.1.10.22',64,'','Inner IPv4');
  const o1=oeth(M.L1,M.S1,'new'),oi1=oip('10.0.0.1','10.0.0.4',64,'new'),u=udp(52214,'new'),v=vx('10010 (VLAN 10)','new');
  SC.push({id:'l2',grp:0,tab:'Bridged · same VNI',color:'over',tunnels:[{a:'V1',b:'V4',from:2,to:4}],stops:[
    {at:'HA',t:'Host A pings Host B',
     d:'Both hosts sit in 10.1.10.0/24 and VLAN 10, on different leaves. Leaf1 already answered Host A’s ARP from its EVPN ARP-suppression table, so Host A frames straight to Host B’s MAC.',
     u:'Nothing yet. The frame is still on Host A’s access link.',o:'An ordinary Layer 2 frame in VLAN 10.',h:[e0,i0,p]},
    {at:'L1',t:'Leaf1 maps VLAN 10 to VNI 10010',
     d:'The access port places the frame in the MAC-VRF for VNI 10010. Host B’s MAC is in the table, learned through an EVPN Type-2 route whose next hop is Leaf4’s VTEP.',
     lk:[[M.B,'remote VTEP 10.0.0.4 · VNI 10010 · EVPN Type-2']],
     u:'Still nothing. Lookup happens inside the leaf.',o:'Destination is behind VTEP 10.0.0.4.',h:[same(e0),same(i0),p]},
    {at:'L1',t:'Leaf1 encapsulates the frame',shell:1,
     d:'The whole original frame becomes payload. Leaf1 adds a VXLAN header with VNI 10010, UDP to port 4789, an outer IP from its loopback to Leaf4’s, and an outer Ethernet header for the first underlay hop. The UDP source port is a hash of the inner flow, which gives the underlay entropy for ECMP.',
     u:'A UDP packet from 10.0.0.1 to 10.0.0.4.',o:'The frame enters the tunnel Leaf1 → Leaf4 (the arc above).',
     h:[o1,oi1,u,v,ie,ii,p],note:'VXLAN adds 50 bytes (14 + 20 + 8 + 8). Fabric links need an MTU of at least the host MTU plus 50, which is why underlay links usually run jumbo frames such as 9216.'},
    {at:'S1',t:'Spine1 routes on the outer header only',shell:1,
     d:'Spine1 carries no VNIs and no tenant MAC tables. It routes 10.0.0.4/32 from the underlay table, rewrites the outer Ethernet header and decrements the outer TTL. ECMP put this flow on Spine1; a flow with a different source port could land on Spine2.',
     u:'One routed hop: 10.0.0.1 → 10.0.0.4.',o:'Nothing. The overlay sees Leaf1 and Leaf4 as directly adjacent.',
     h:[oeth(M.S1,'2c:6b:f5:04:00:30','changed'),oip('10.0.0.1','10.0.0.4',63,'changed'),same(u),same(v),ie,ii,p]},
    {at:'L4',t:'Leaf4 decapsulates',
     d:'The outer destination is Leaf4’s own VTEP and the UDP port is 4789, so Leaf4 strips the 50 bytes, maps VNI 10010 back to VLAN 10, and finds Host B’s MAC on a local port.',
     u:'The packet ends here, at VTEP 10.0.0.4.',o:'The frame leaves the tunnel unchanged.',
     h:[gone(o1),gone(oip('10.0.0.1','10.0.0.4',63)),gone(u),gone(v),same(e0),same(i0),p]},
    {at:'HB',t:'Delivered to Host B',
     d:'Host B receives the frame Host A sent: same MACs, inner TTL still 64. The underlay never saw a tenant MAC, and the overlay never saw a spine.',
     u:'Done.',o:'A single Layer 2 hop from Host A.',h:[same(e0),same(i0),p]}
  ]});
})();

/* Symmetric IRB */
(function(){
  const p=icmp();
  const e0=eth(M.A,M.GW,'new'),i0=ip('10.1.10.11','10.1.20.33',64,'new');
  const ie=eth(M.L1,M.L3,'changed','Inner Ethernet',null,'l3'),ii=ip('10.1.10.11','10.1.20.33',63,'changed','Inner IPv4','l3');

function buildTunnels(){

  const showBytes=!sc.noBytes&&!s.h.some(h=>h.k==='bgp');
  const lk=s.lk?`<div class="lookup"><span class="lk">Table on ${n.n}</span>${s.lk.map(r=>`<div><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div>`:'';
  const cmp=s.cmp?`<div class="cmpwrap"><table class="cmp"><thead><tr>${s.cmp.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${s.cmp.rows.map(r=>`<tr><th>${r[0]}</th>${r.slice(1).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';
  $('panel').innerHTML=`<div class="eyebrow">Stop ${cur+1} of ${sc.stops.length} · ${n.n}${s.tag?' · GBP '+s.tag:''}</div><h2>${s.t}</h2>${s.drop?`<div class="drop">${s.drop}</div>`:''}<p>${s.d}</p>${lk}
   <dl class="sees"><dt class="u">Underlay sees</dt><dd>${s.u}</dd><dt class="o">Overlay sees</dt><dd>${s.o}</dd></dl>
   <div class="stackhead"><span>${s.h.some(h=>h.k==='bgp')?'Headers and route at this stop':'Headers at this stop'}</span>${showBytes?`<span class="tot">${bytes} B on the wire</span>`:''}</div>
   <div class="stack">${rows}</div>${cmp}${s.note?`<div class="note">${s.note}</div>`:''}`;
  $('panel').scrollTop=0;
}
function wrap(g,text,x,y,maxW,lh){const words=text.split(' ');let line='';for(const w of words){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=w;}else line=t;}if(line){g.fillText(line,x,y);y+=lh;}return y;}
const VRC={under:CSS.under,vx:'#00e8cf',ctrl:CSS.ctrl,esi:CSS.esi,gbp:CSS.gbp,l3:CSS.l3,over:CSS.over,drop:CSS.drop};
function drawVR(){
  const g=vrCanvas.getContext('2d'),s=sc.stops[cur],n=N[s.at];
  g.clearRect(0,0,1024,1024);g.fillStyle='rgba(34,34,34,.95)';g.fillRect(0,0,1024,1024);
  g.fillStyle=CSS[sc.color];g.fillRect(0,0,1024,10);
  g.fillStyle='#a6a6a6';g.font='30px "IBM Plex Mono",monospace';g.fillText(`STOP ${cur+1}/${sc.stops.length} · ${n.n.toUpperCase()}${s.tag?' · GBP '+s.tag:''}`,40,64);
  g.fillStyle='#f4f4f4';g.font='600 56px "Barlow Condensed","Arial Narrow",sans-serif';let y=wrap(g,s.t,40,132,944,58);
  if(s.drop){g.fillStyle=CSS.drop;g.font='600 32px "IBM Plex Sans",sans-serif';g.fillText('✕ '+s.drop,40,y+10);y+=50;}
  g.font='28px "IBM Plex Sans",sans-serif';g.fillStyle=CSS.under;y=wrap(g,'Underlay: '+s.u,40,y+10,944,36);g.fillStyle=CSS.over;y=wrap(g,'Overlay: '+s.o,40,y+4,944,36);
  y+=14;
  for(const h of s.h){if(y>920)break;g.globalAlpha=h.st==='gone'?.35:1;g.fillStyle='#2b2b2b';g.fillRect(40,y,944,74);g.fillStyle=VRC[h.c||DEFC[h.k]||'over'];g.fillRect(40,y,10,74);
    g.fillStyle='#f4f4f4';g.font='600 30px "IBM Plex Sans",sans-serif';g.fillText(h.nm+(h.st==='new'?'  + added':h.st==='gone'?'  − removed':h.st==='changed'?'  ~ rewritten':''),66,y+32);
    g.fillStyle='#b5b5b5';g.font='24px "IBM Plex Mono",monospace';g.fillText(h.f.slice(0,2).map(f=>f[0]+' '+f[1]).join('   ').slice(0,66),66,y+62);y+=84;}
  g.globalAlpha=1;g.fillStyle='#727272';g.font='26px "IBM Plex Mono",monospace';g.fillText('Trigger: next hop   ·   Grip: ride / overview',40,1000);
  vrTex.needsUpdate=true;
}
function setMode(m){mode=m;$('vRide').setAttribute('aria-pressed',m==='ride');$('vOver').setAttribute('aria-pressed',m==='over');
  if(renderer.xr.isPresenting)return;
  if(m==='over'){controls.enabled=true;camera.position.copy(overSaved.pos);controls.target.copy(overSaved.tgt);controls.update();}
  else{overSaved.pos.copy(camera.position);overSaved.tgt.copy(controls.target);controls.enabled=false;look.copy(packet.position);}}
$('next').onclick=next;$('prev').onclick=prev;$('restart').onclick=()=>jump(0);
$('auto').onclick=()=>{auto=!auto;$('auto').setAttribute('aria-pressed',auto);dwell=0;if(auto&&!moving&&cur>=sc.stops.length-1)jump(0);};
$('vRide').onclick=()=>setMode('ride');$('vOver').onclick=()=>setMode('over');
$('tU').onclick=()=>{underG.visible=!underG.visible;$('tU').setAttribute('aria-pressed',underG.visible);};
$('tO').onclick=()=>{overG.visible=!overG.visible;$('tO').setAttribute('aria-pressed',overG.visible);};
$('speed').onchange=e=>{speed=parseFloat(e.target.value)||1;};
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.code==='Space'||e.key==='ArrowRight'){e.preventDefault();next();}else if(e.key==='ArrowLeft')prev();else if(e.key==='v'||e.key==='V')setMode(mode==='ride'?'over':'ride');});
let toastT;function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,6000);}

/* ---------------- WebXR ---------------- */
const vrBtn=$('vr');
if(!navigator.xr){vrBtn.textContent='VR: needs a headset browser';vrBtn.disabled=true;}
else navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(!ok){vrBtn.textContent='VR not supported here';vrBtn.disabled=true;}}).catch(()=>{vrBtn.textContent='VR blocked here';vrBtn.disabled=true;});
vrBtn.onclick=async()=>{
  if(renderer.xr.isPresenting){renderer.xr.getSession().end();return;}
  try{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
    await renderer.xr.setSession(s);controls.enabled=false;vrPanel.visible=true;setMode('ride');vrBtn.textContent='Exit VR';
    s.addEventListener('end',()=>{vrPanel.visible=false;rig.position.set(0,0,0);rig.rotation.set(0,0,0);vrBtn.textContent='Enter VR';camera.position.copy(overSaved.pos);setMode('over');});
  }catch(err){toast('This page could not start VR here. Host the HTML file on your own site and open it in the headset browser.');}
};
[0,1].forEach(i=>{const c=renderer.xr.getController(i);c.addEventListener('select',next);c.addEventListener('squeeze',()=>setMode(mode==='ride'?'over':'ride'));rig.add(c);});

/* ---------------- loop ---------------- */
function resize(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);renderer.domElement.style.width=w+'px';renderer.domElement.style.height=h+'px';camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);resize();

let last=performance.now(),yaw=0,trailAcc=0;
const tmp=new THREE.Vector3(),tmp2=new THREE.Vector3();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const tgt=moving?sc.stops[cur+1]:null;
  if(moving){legT+=dt/legDur;
    if(legT>=1){legT=1;moving=false;cur++;packet.position.copy(stopPos(cur));packet.visible=true;if(sc.stops[cur].jump)resetTrail();arrive();}
    else{packet.position.lerpVectors(stopPos(cur),stopPos(cur+1),ease(legT));packet.visible=!tgt.jump;}}
  else if(auto&&cur<sc.stops.length-1){dwell+=dt;if(dwell>5/speed)next();}
  const P=packet.position,st=sc.stops[cur];
  trailAcc+=dt;if(trailAcc>.03&&packet.visible){trailAcc=0;pushTrail(P);}
  /* packet appearance */
  const dropped=!moving&&st.drop;
  tint(packet,dropped?COL.drop:COL[sc.color]);
  const sh=packet.userData.shell;
  const ns=THREE.MathUtils.lerp(sh.scale.x,st.shell?1:.001,1-Math.exp(-dt*6));sh.scale.setScalar(Math.max(.001,ns));sh.rotation.y+=dt*.6;sh.rotation.x+=dt*.25;
  packet.userData.core.rotation.y-=dt*1.2;
  packet.scale.setScalar(dropped?(REDUCE?.6:.55+.12*Math.sin(now/120)):1);
  /* GBP tag */
  const tagNow=(moving&&tgt.jump)?null:(moving?(tgt.tag&&st.tag?st.tag:null):st.tag);
  tagG.visible=!!tagNow&&packet.visible;
  if(tagNow){tagG.position.copy(P);tagRing.rotation.x=Math.PI/2+.5*Math.sin(now/700);tagRing.rotation.z+=dt*1.5;
    const s=tagLabel(tagNow);if(tagSprite!==s){if(tagSprite)tagSprite.visible=false;tagSprite=s;}s.visible=true;
    tagRing.material.color.setHex(dropped?COL.drop:COL.gbp);}
  const a=attach(st.at);active.position.set(a.x,N[st.at].t==='host'?.05:a.y-.32,a.z);
  active.material.color.setHex(dropped?COL.drop:COL[sc.color]);
  if(!REDUCE)active.scale.setScalar(1+.06*Math.sin(now/300));
  /* overlay ghosts */
  const g=cur+(moving?ease(legT):0);
  ghosts.forEach(x=>x.visible=false);
  for(const k in tunnels){tunnels[k].mat.opacity=.13;tunnels[k].mat.color.setHex(COL.over);}
  (sc.tunnels||[]).forEach((tu,i)=>{const {t,rev}=tun(tu.a,tu.b);if(g>=tu.from&&g<=tu.to){let f=(g-tu.from)/(tu.to-tu.from);if(rev)f=1-f;
    t.mat.opacity=.55;t.mat.color.setHex(COL[sc.color]);if(ghosts[i]){ghosts[i].visible=true;ghosts[i].position.copy(t.curve.getPoint(f));}}});
  if(st.hl&&!moving)st.hl.forEach(pr=>{const {t}=tun(pr[0],pr[1]);t.mat.opacity=.4+.25*Math.sin(now/250);t.mat.color.setHex(COL[sc.color]);});
  /* clones: [from,to,side,drop,stopFrac] */
  clones.forEach(c=>c.visible=false);
  const cs=moving?(tgt.clones||[]):(st.clones||[]);
  cs.forEach((c,i)=>{const cl=clones[i];if(!cl)return;cl.visible=true;const sf=c[4]||1;const e=moving?ease(legT):1;const f=e*sf;
    cl.position.lerpVectors(attach(c[0]),attach(c[1]),f);cl.position.z+=(c[2]?.45:-.45)*(1-Math.abs(2*e-1))*.6;
    const isDrop=c[3]&&e>=.98;tint(cl,isDrop?COL.drop:COL[sc.color]);cl.scale.setScalar(isDrop?.55:.8);
    cl.userData.shell.scale.setScalar(Math.max(.001,sh.scale.x*(isDrop?0:1)));});
  /* camera */
  const k=1-Math.exp(-dt*(REDUCE?10:3));
  if(renderer.xr.isPresenting){
    if(mode==='ride'){tmp.copy(P).addScaledVector(fwdH,-2.2);tmp.y-=1.45;rig.position.lerp(tmp,k);
      const ty=Math.atan2(-fwdH.x,-fwdH.z);let d=ty-yaw;d=Math.atan2(Math.sin(d),Math.cos(d));yaw+=d*k;rig.rotation.y=yaw;}
    else{rig.position.lerp(tmp.set(0,5.5,27),k);yaw+=(0-yaw)*k;rig.rotation.y=yaw;}
  }else if(mode==='ride'){
    tmp.copy(P).addScaledVector(fwdH,-4.4);tmp.y+=1.9;camera.position.lerp(tmp,k);
    look.lerp(tmp2.copy(P).addScaledVector(fwd,1.2),k);camera.lookAt(look);
  }else controls.update();
  renderer.render(scene,camera);
}

const ready=Promise.race([Promise.all([document.fonts.load('600 60px "Barlow Condensed"'),document.fonts.load('31px "IBM Plex Mono"'),document.fonts.load('28px "IBM Plex Sans"')]).catch(()=>{}),new Promise(r=>setTimeout(r,1800))]);
ready.then(()=>{build();buildTunnels();loadScenario(0);renderer.setAnimationLoop(tick);});
})();
</script>
